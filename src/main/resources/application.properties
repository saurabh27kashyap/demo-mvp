server.port=8081

# H2 - an in-memory database, nothing is saved to disk
spring.datasource.url=jdbc:h2:mem:payroll;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# browse tables/data in a browser at http://localhost:8081/h2-console
spring.h2.console.enabled=true

# ---------------------------------------------------------------------------
# THE MODEL
# Switching provider is a config change, not a code change: Groq, OpenAI, Together
# and most local servers all speak the same OpenAI-compatible API, so only these
# three lines move. The key is an environment variable and is never written here.
#
# Note: Spring AI's OpenAI starter was tried first but hit an open, unfixed bug with
# Groq's tool-calling (spring-ai#6968 - it replays an unsupported 'reasoning_content'
# field). Calling the API directly avoids that and shows exactly what is sent.
# ---------------------------------------------------------------------------
llm.base-url=https://api.groq.com/openai/v1
llm.model=openai/gpt-oss-120b
llm.api-key=${GROQ_API_KEY}
